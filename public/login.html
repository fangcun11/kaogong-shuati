<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<title>登录 · 没钱考什么公</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #111114;
    --muted: #6b6b73;
    --line: rgba(60,60,67,.14);
    --blue: #007aff;
    --red: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #fff; --muted: #a1a1aa; --line: rgba(84,84,88,.55); --blue: #0a84ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .login-card {
    width: min(420px, 100%);
    padding: 32px 28px 26px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--card);
  }
  .brand-mark {
    width: 56px; height: 56px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--blue); color: #fff;
    font-size: 26px; font-weight: 800;
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 8px; font-size: 25px; letter-spacing: -.5px; }
  .sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 650; }
  input {
    width: 100%; height: 48px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 12px;
    background: transparent; color: var(--text); font-size: 16px; outline: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,122,255,.13); }
  button {
    width: 100%; height: 50px; margin-top: 24px;
    border: 0; border-radius: 13px; background: var(--blue); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .error { min-height: 20px; margin-top: 12px; color: var(--red); font-size: 13px; line-height: 1.5; }
  .note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
</style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark">公</div>
    <h1>没钱考什么公</h1>
    <p class="sub">登录后继续刷题。你的题库记录、错题、收藏和笔记只属于你的账号。</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-btn" type="submit">登录</button>
      <div id="login-error" class="error" role="alert"></div>
    </form>
    <div class="note">账号由管理员创建；忘记密码请联系管理员重置。</div>
  </main>
  <script src="login.js" defer></script>
</body>
</html>
